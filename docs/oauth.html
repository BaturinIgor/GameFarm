<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Harvest Hollow · Вход</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Вход выполнен</h1>
<p>Скопируйте адрес этой страницы целиком и вставьте его в окно marketing/publish_clips.py.
Страница ничего никуда не отправляет.</p>
<p><button id="copy">Скопировать адрес</button></p>
<p class="muted" id="url" style="word-break: break-all"></p>
<script>
  document.getElementById("url").textContent = location.href;
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(location.href).then(() => { this.textContent = "Скопировано"; });
  };
</script>
</main>
</body>
</html>
