name: Build IPA

# Swift-версия заморожена: единая версия игры - Godot (android.yml, ios-godot.yml).
# Старую сборку IPA можно запустить только вручную.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sprites
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: |
          set -o pipefail
          if [ -z "$ASSETS_KEY" ]; then
            echo "::warning::ASSETS_KEY secret is not set, building with emoji graphics"
            exit 0
          fi
          if openssl enc -d -aes-256-cbc -md sha256 -in Art/sprites.enc -pass env:ASSETS_KEY | tar -xz -C GameFarm/Resources; then
            echo "::notice::Sprites unpacked: $(ls GameFarm/Resources/Sprites | wc -l | tr -d ' ') files"
          else
            echo "::warning::Could not decrypt sprites, building with emoji graphics"
            rm -rf GameFarm/Resources/Sprites
          fi

      - name: Install tools
        run: |
          brew install xcodegen ldid
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set +e
          xcodebuild \
            -project GameFarm.xcodeproj \
            -scheme GameFarm \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SIDELOAD' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          echo "---- errors ----"
          grep -E "error:|fatal error" build.log | sort -u | head -150
          echo "---- tail ----"
          tail -40 build.log
          exit $status

      - name: Publish errors on failure
        if: failure()
        run: |
          grep -E "error:|fatal error" build.log | sort -u > errors.txt || true
          head -40 errors.txt | sed 's/^/::error::/' || true
          tail -250 build.log > tail.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f errors.txt tail.txt
          git commit -q -m "CI errors run ${{ github.run_number }}"
          git push -q -f origin ci-logs

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/GameFarm.app"
          ls "$APP" "$APP/Frameworks" 2>/dev/null || true
          if [ -d "$APP/Frameworks" ]; then
            for f in "$APP"/Frameworks/*.framework; do ldid -S "$f/$(basename "$f" .framework)" || true; done
          fi
          ldid -S "$APP/GameFarm"
          echo "::notice::Bundle: $(ls "$APP"/sp_*.png 2>/dev/null | wc -l | tr -d ' ') sprites, $(ls "$APP"/*.json 2>/dev/null | wc -l | tr -d ' ') json files, $(ls -d "$APP"/*.lproj 2>/dev/null | wc -l | tr -d ' ') lproj, frameworks: $(ls "$APP/Frameworks" 2>/dev/null | tr '\n' ' ')"
          rm -rf Payload GameFarm.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry GameFarm.ipa Payload
          ls -lh GameFarm.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameFarm-ipa
          path: GameFarm.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" GameFarm.ipa \
            --title "GameFarm, сборка ${{ github.run_number }}" \
            --notes "Скачай GameFarm.ipa и установи через SideStore." \
            --latest
