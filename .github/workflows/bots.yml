name: Bots

# Прогон ботов-игроков (godot/tests/sim): баланс, время прохождения, нужен ли донат.
# Запускается вручную: Actions -> Bots -> Run workflow. Отчёты JSON - в артефакте bot-reports.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Сколько игровых дней"
        default: "60"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5.1"

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [casual, active, noads, payer, whale]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare data
        run: sh tools/godot_sync.sh

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-editor-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot

      - name: Import project
        run: timeout 300 ~/godot-bin/godot --headless --path godot --import > import.log 2>&1 || true

      - name: Run bot
        run: |
          timeout 3000 ~/godot-bin/godot --headless --path godot -- --simulate ${{ matrix.profile }} ${{ inputs.days }} 2>&1 | tee bot.log | grep -E "^==|^   "
          mkdir -p reports
          cp ~/.local/share/godot/app_userdata/*/sim/${{ matrix.profile }}.json reports/

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bot-${{ matrix.profile }}
          path: reports/
