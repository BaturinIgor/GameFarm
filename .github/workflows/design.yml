name: Design screens

# Макеты всех экранов, окон и состояний текущей версии (Godot) в design/<версия>/screens.
# Сценарий снимков - godot/scripts/debug/shot_driver.gd (-- --shots), разрешение iPhone 6.9"
# (1290x2796), русский язык. Swift-версии 1.0-1.3 снимаются из веток design/gamefarm-<версия>.
# PNG лежат в артефакте design-screens и коммитятся в ветку.

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Язык (ru, en, ...)"
        default: "ru"
  pull_request:
    paths:
      - godot/scripts/debug/shot_driver.gd
      - .github/workflows/design.yml

permissions:
  contents: write

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Дважды подряд шаг висел по 40 минут на apt-get: ставим предел и повторы загрузки
      - name: Prepare assets
        timeout-minutes: 15
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
            && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg > /dev/null)
          # Pillow рисует картинку заставки (tools/make_splash.py)
          python3 -c "import PIL" 2> /dev/null \
            || python3 -m pip install -q --break-system-packages pillow \
            || python3 -m pip install -q --user pillow
          sh tools/godot_sync.sh
          test -f godot/assets/splash.png || { echo "::error::assets/splash.png не создан"; exit 1; }

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head

      - name: Import project
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --path godot --import 2>&1 | tee import.log | tail -40
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: .*(Failed|parse|Parse)" import.log; then
            echo "::error::Script errors during import"
            exit 1
          fi

      - name: Take design screenshots
        env:
          LANG_CODE: ${{ inputs.language || 'ru' }}
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1 || true
          mkdir -p design-screens
          timeout 600 xvfb-run -a -s "-screen 0 1290x2796x24" ~/godot-bin/godot --path godot \
            --rendering-driver opengl3 --resolution 1290x2796 -- --shots "$GITHUB_WORKSPACE/design-screens" --lang "$LANG_CODE" > shots.log 2>&1 || true
          tail -30 shots.log
          if grep -E "SCRIPT ERROR" shots.log; then echo "::error::Script errors during the screenshot scenario"; exit 1; fi
          ls design-screens | wc -l

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-screens
          path: design-screens
          if-no-files-found: ignore

      - name: Commit screenshots to design/<version>/screens
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*: *//; s/"//g')
          DEST="design/$VERSION/screens"
          rm -rf "$DEST" && mkdir -p "$DEST"
          find design-screens -maxdepth 1 -name '*.png' -exec cp {} "$DEST"/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Design screens $VERSION: $(ls "$DEST"/*.png | wc -l | tr -d ' ') screenshots"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
