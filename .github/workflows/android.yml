name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - "Art/**"
      - "GameFarm/Resources/Layouts/**"
      - "GameFarm/Resources/Strings/**"
      - "GameFarm/Resources/Assets.xcassets/AppIcon.appiconset/**"
      - "tools/godot_sync.sh"
      - "tools/make_splash.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Prepare assets
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          # Pillow рисует картинку заставки (tools/make_splash.py)
          python3 -c "import PIL" 2> /dev/null \
            || python3 -m pip install -q --break-system-packages pillow \
            || python3 -m pip install -q --user pillow
          sh tools/godot_sync.sh
          test -f godot/assets/splash.png || { echo "::error::assets/splash.png не создан"; exit 1; }

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Editor settings for Android export
        run: |
          set -e
          mkdir -p ~/.config/godot
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK: $SDK, Java: $JAVA_HOME"
          ls "$SDK/build-tools" "$SDK/platforms" "$SDK/cmdline-tools" 2>&1 || true
          for f in editor_settings-4.tres editor_settings-4.5.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/godot/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          sed -i 's/^          //' ~/.config/godot/editor_settings-4*.tres
          cat ~/.config/godot/editor_settings-4.5.tres

      - name: Import project
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --path godot --import 2>&1 | tee import.log | tail -40
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: .*(Failed|parse|Parse)" import.log; then
            echo "::error::Script errors during import"
            exit 1
          fi

      - name: Compile all scripts
        run: |
          set +e
          timeout 120 ~/godot-bin/godot --headless --path godot -- --check-scripts > check.log 2>&1
          code=$?
          tail -40 check.log
          if [ $code -ne 0 ] || grep -E "SCRIPT ERROR|Parse Error" check.log; then
            echo "::error::Scripts failed to compile"
            exit 1
          fi

      - name: Smoke run (scripts load, first frames)
        run: |
          set +e
          timeout 60 ~/godot-bin/godot --headless --path godot --quit-after 240 > run.log 2>&1
          echo "exit: $?"
          tail -60 run.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid get|Invalid set|Nonexistent function|Cannot call" run.log; then
            echo "::error::Script errors while running"
            exit 1
          fi
          exit 0

      - name: Screenshots (software rendering)
        id: shots
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1 || true
          mkdir -p shots
          # Заставка в масштабе 3x, как на iPhone: два снимка, затем переход в игру и выход
          timeout 60 xvfb-run -a -s "-screen 0 1170x2532x24" ~/godot-bin/godot --path godot \
            --rendering-driver opengl3 --resolution 1170x2532 -- --splash-shot "$GITHUB_WORKSPACE/shots" > splash.log 2>&1 || true
          tail -15 splash.log
          if grep -E "SCRIPT ERROR" splash.log; then
            echo "::error::Script errors in the splash scene"
            exit 1
          fi
          timeout 180 xvfb-run -a -s "-screen 0 1170x2532x24" ~/godot-bin/godot --path godot \
            --rendering-driver opengl3 --resolution 390x844 -- --shots "$GITHUB_WORKSPACE/shots" > shots.log 2>&1 || true
          tail -30 shots.log
          if grep -E "SCRIPT ERROR" shots.log; then
            echo "::error::Script errors during the screenshot scenario"
            exit 1
          fi
          ls -la shots

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/godot/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.${{ github.run_number }}\"/" godot/export_presets.cfg
          ~/godot-bin/godot --headless --verbose --path godot --export-debug "Android" "$GITHUB_WORKSPACE/HarvestHollow.apk" 2>&1 | tee export.log | tail -60
          ls -lh HarvestHollow.apk

      - name: Publish logs to ci-logs-android branch
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp import.log check.log run.log export.log shots.log splash.log /tmp/logs/ 2>/dev/null || true
          cp -r shots /tmp/logs/ 2>/dev/null || true
          grep -hE "ERROR|SCRIPT ERROR|error" /tmp/logs/*.log 2>/dev/null | head -30 | sed 's/^/::warning::/' || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-android
          git rm -rf --cached . > /dev/null
          cp -r /tmp/logs/* . 2>/dev/null || true
          git add -f *.log 2>/dev/null || true
          [ -d shots ] && git add -f shots || true
          git commit -q -m "Godot logs run ${{ github.run_number }}" || true
          git push -q -f origin ci-logs-android || true
          git checkout -q main 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            import.log
            run.log
            export.log
          if-no-files-found: ignore

      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.shots.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${{ github.run_number }}"
          gh release create "$TAG" HarvestHollow.apk \
            --title "Harvest Hollow для Android, сборка ${{ github.run_number }}" \
            --notes "Скачай HarvestHollow.apk на телефон и открой файл. Если Android спросит, разреши установку из этого источника." \
            --prerelease
