name: Build IPA (Godot)

# iOS-сборка Godot-версии: экспорт проекта Xcode из Godot с плагином покупок InAppStore (StoreKit),
# xcodebuild без подписи, IPA для SideStore. Проект Xcode выкладывается артефактом HarvestHollow-xcode:
# из него в Xcode на Маке делается подписанный архив для App Store. Bundle id тот же, что у
# Swift-версии (com.personal.gamefarm). Логи кладутся в ветку ci-logs-ios.

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - "Art/**"
      - "GameFarm/Resources/Layouts/**"
      - "GameFarm/Resources/Strings/**"
      - "GameFarm/Resources/Audio/**"
      - "GameFarm/Resources/Assets.xcassets/AppIcon.appiconset/**"
      - "tools/godot_sync.sh"
      - "tools/make_splash.py"
      - "tools/build_ios_plugins.sh"
      - "tools/ios_plugins/**"
      - "tools/fetch_admob.sh"
      - ".github/workflows/ios-godot.yml"
  workflow_dispatch:
    inputs:
      appstore:
        description: "Подписать и загрузить в App Store Connect (TestFlight)"
        type: boolean
        default: false
      iap:
        description: "Только завести новые покупки из tools/appstore/iap_1_1.json (без сборки)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-ipa-godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  # Новые встроенные покупки в App Store Connect через API (то же, что asc_iap.py на Маке).
  # Уже заведённые покупки скрипт пропускает.
  iap:
    if: inputs.iap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create in-app purchases
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          python3 tools/appstore/asc_iap.py --issuer "$ASC_ISSUER_ID" --key-id "$ASC_KEY_ID" --key "$KEY" \
            --data tools/appstore/iap_1_1.json --shot tools/appstore/screenshots/en/03_6_chest_open10.png
          rm -f "$KEY"

  build:
    if: ${{ !inputs.iap }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ogg из m4a: кодировщик ставится только если звуки поменялись
      - name: Cache converted audio
        id: cache-audio
        uses: actions/cache@v4
        with:
          path: godot/assets/audio
          key: ogg-${{ hashFiles('GameFarm/Resources/Audio/**') }}-v1

      - name: Prepare assets
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
          AUDIO_CACHED: ${{ steps.cache-audio.outputs.cache-hit }}
        run: |
          set -e -o pipefail
          {
            # В ffmpeg из Homebrew нет libvorbis: m4a читает afconvert, ogg пишет oggenc
            if [ "$AUDIO_CACHED" != "true" ]; then
              command -v oggenc > /dev/null || brew install vorbis-tools
            fi
            echo "python: $(command -v python3) $(python3 --version)"
            python3 -c "import PIL" 2> /dev/null \
              || python3 -m pip install -q --break-system-packages pillow \
              || python3 -m pip install -q --user pillow
            sh tools/godot_sync.sh
          } 2>&1 | tee prepare.log | tail -60
          test -f godot/assets/splash.png || { echo "::error::assets/splash.png не создан"; exit 1; }
          ls godot/assets/audio/*.ogg > /dev/null 2>&1 || { echo "::error::Звуки не перекодированы"; exit 1; }

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/godot-templates
          key: godot-macos-${{ env.GODOT_VERSION }}-ios-v1

      # Редактор для macOS и из шаблонов экспорта только ios.zip
      - name: Download Godot and iOS export template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin ~/godot-templates
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot-bin
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" templates/ios.zip templates/version.txt -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* ~/godot-templates/
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"
          ls -la ~/godot-bin ~/godot-templates

      - name: Set up Godot
        run: |
          TPL="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$TPL"
          ln -sfn "$HOME/godot-templates" "$TPL/${GODOT_VERSION}.stable"
          echo "GODOT=$HOME/godot-bin/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          "$HOME/godot-bin/Godot.app/Contents/MacOS/Godot" --version
          xcodebuild -version

      # Плагины iOS: покупки (inappstore), iCloud, Game Center из godot-ios-plugins и свой localnotify
      # (уведомления), собираются под эту версию Godot
      - name: Cache iOS plugins
        id: cache-iap
        uses: actions/cache@v4
        with:
          path: ~/ios-plugins
          key: ios-plugins-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/build_ios_plugins.sh', 'tools/ios_plugins/**') }}-v1

      - name: Build iOS plugins
        if: steps.cache-iap.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          set -o pipefail
          bash tools/build_ios_plugins.sh "$HOME/ios-plugins" 2>&1 | tee iap.log | tail -80

      - name: Install iOS plugins
        run: |
          set -e
          mkdir -p godot/ios/plugins
          for p in inappstore icloud gamecenter localnotify; do
            rm -rf "godot/ios/plugins/$p"
            cp -R "$HOME/ios-plugins/$p" "godot/ios/plugins/$p"
          done
          ls -laR godot/ios/plugins | head -60

      # Реклама за награду: плагин Poing Studios, Google Mobile Ads SDK и UMP (окна согласия)
      - name: Cache AdMob
        id: cache-admob
        uses: actions/cache@v4
        with:
          path: ~/admob
          key: admob-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/fetch_admob.sh') }}-v1

      - name: Fetch AdMob
        if: steps.cache-admob.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash tools/fetch_admob.sh "$HOME/admob" 2>&1 | tee admob.log | tail -60

      - name: Install AdMob
        run: |
          set -e
          mkdir -p godot/ios/plugins
          rm -rf godot/ios/plugins/admob
          cp -R "$HOME/admob" godot/ios/plugins/admob
          cat godot/ios/plugins/admob/admob.gdip | head -30

      - name: Import project
        timeout-minutes: 10
        run: |
          set -o pipefail
          "$GODOT" --headless --path godot --import 2>&1 | tee import.log | tail -40
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: .*(Failed|parse|Parse)" import.log; then
            echo "::error::Script errors during import"
            exit 1
          fi

      - name: Compile all scripts
        timeout-minutes: 5
        run: |
          set +e
          "$GODOT" --headless --path godot -- --check-scripts > check.log 2>&1
          code=$?
          tail -40 check.log
          if [ $code -ne 0 ] || grep -E "SCRIPT ERROR|Parse Error" check.log; then
            echo "::error::Scripts failed to compile"
            exit 1
          fi

      - name: Run tests
        timeout-minutes: 5
        run: |
          set +e
          "$GODOT" --headless --path godot -- --run-tests > tests.log 2>&1
          code=$?
          grep -vE "^ok " tests.log | tail -60
          if [ $code -ne 0 ]; then
            echo "::error::Tests failed (godot/tests, see tests.log)"
            exit 1
          fi

      # Только проект Xcode (application/export_project_only), подписи нет.
      # Team ID в пресете - заглушка: Godot без него не экспортирует, при сборке он сбрасывается.
      - name: Export Xcode project
        timeout-minutes: 15
        run: |
          set -o pipefail
          # Версия для App Store - из пресета (application/short_version), номер сборки - номер запуска (растёт сам)
          V=$(sed -n 's/^application\/short_version="\(.*\)"/\1/p' godot/export_presets.cfg | head -1)
          [ -n "$V" ] || { echo "::error::Нет application/short_version в export_presets.cfg"; exit 1; }
          B="${{ github.run_number }}"
          perl -pi -e "s/^application\/short_version=.*/application\/short_version=\"$V\"/; s/^application\/version=.*/application\/version=\"$B\"/" godot/export_presets.cfg
          rm -rf build-ios && mkdir -p build-ios
          "$GODOT" --headless --verbose --path godot --export-release "iOS" "$GITHUB_WORKSPACE/build-ios/HarvestHollow.xcodeproj" 2>&1 | tee export.log | tail -60
          ls -la build-ios
          test -d build-ios/HarvestHollow.xcodeproj || { echo "::error::Godot did not export the Xcode project"; exit 1; }
          grep -q "inappstore" build-ios/HarvestHollow.xcodeproj/project.pbxproj || { echo "::error::Плагин InAppStore не попал в проект"; exit 1; }
          grep -q "GoogleMobileAds" build-ios/HarvestHollow.xcodeproj/project.pbxproj || { echo "::error::AdMob не попал в проект"; exit 1; }
          for p in icloud gamecenter localnotify; do
            grep -q "$p.xcframework" build-ios/HarvestHollow.xcodeproj/project.pbxproj || { echo "::error::Плагин $p не попал в проект"; exit 1; }
          done
          (cd build-ios && zip -qry ../HarvestHollow-xcode.zip .)

      # Проект Xcode до сборки: его открывают на Маке, подписывают своей командой и отправляют в App Store
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: HarvestHollow-xcode
          path: HarvestHollow-xcode.zip

      # Загрузка в App Store без Xcode на Маке: подпись облачная, через ключ API App Store Connect
      # (xcodebuild -allowProvisioningUpdates сам заводит сертификат и профиль). Нужны секреты
      # APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (ключ с ролью Admin).
      - name: App Store - archive, export, upload
        if: inputs.appstore
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Без -e: статус xcodebuild проверяется вручную, а пустой grep не должен валить шаг
          set +e -uo pipefail
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Не задан секрет ${name/TEAM_ID/APPLE_TEAM_ID}"; exit 1; }
          done
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY="$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Старые сертификаты «Created via API» от прошлых сборок занимают лимит команды (10)
          python3 tools/appstore/asc_ci_certs.py --issuer "$ASC_ISSUER_ID" --key-id "$ASC_KEY_ID" --key "$KEY" \
            || echo "::warning::Не удалось удалить старые сертификаты разработчика CI"
          ARCHIVE="$RUNNER_TEMP/HarvestHollow.xcarchive"
          xcodebuild \
            -project build-ios/HarvestHollow.xcodeproj \
            -scheme HarvestHollow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            "${AUTH[@]}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            archive > appstore.log 2>&1
          status=$?
          grep -E "error:|fatal error" appstore.log | sort -u | head -60 | sed 's/^/::error::/' || true
          tail -30 appstore.log
          if [ $status -ne 0 ]; then
            python3 tools/appstore/asc_ci_certs.py --issuer "$ASC_ISSUER_ID" --key-id "$ASC_KEY_ID" --key "$KEY" || true
            exit $status
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}" >> appstore.log 2>&1
          status=$?
          tail -40 appstore.log
          # Сертификат разработчика, созданный этой сборкой, больше не нужен: у команды их не больше 10
          python3 tools/appstore/asc_ci_certs.py --issuer "$ASC_ISSUER_ID" --key-id "$ASC_KEY_ID" --key "$KEY" \
            || echo "::warning::Не удалось удалить сертификаты разработчика CI"
          rm -rf "$KEY_DIR"
          [ $status -eq 0 ] || { echo "::error::Экспорт или загрузка не прошли, см. appstore.log"; exit $status; }
          echo "::notice::Сборка $(sed -n 's/^application\/short_version="\(.*\)"/\1/p' godot/export_presets.cfg | head -1) (${{ github.run_number }}) отправлена в App Store Connect. Через 10-30 минут появится в TestFlight."

      - name: Build (xcodebuild archive, no signing)
        if: ${{ !inputs.appstore }}
        run: |
          set +e
          xcodebuild \
            -project build-ios/HarvestHollow.xcodeproj \
            -scheme HarvestHollow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build-ios/HarvestHollow.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive > build.log 2>&1
          status=$?
          grep -E "error:|fatal error" build.log | sort -u > errors.txt
          echo "---- errors ----"
          head -100 errors.txt
          head -40 errors.txt | sed 's/^/::error::/'
          echo "---- tail ----"
          tail -40 build.log
          exit $status

      # Псевдоподпись ldid, как в build.yml: SideStore переподписывает приложение своим сертификатом
      - name: Package IPA
        if: ${{ !inputs.appstore }}
        run: |
          set -e
          brew install ldid > /dev/null
          APP="build-ios/HarvestHollow.xcarchive/Products/Applications/HarvestHollow.app"
          ls -la "$APP"
          if [ -d "$APP/Frameworks" ]; then
            for f in "$APP"/Frameworks/*.framework; do [ -d "$f" ] && ldid -S "$f/$(basename "$f" .framework)" || true; done
            for f in "$APP"/Frameworks/*.dylib; do [ -f "$f" ] && ldid -S "$f" || true; done
          fi
          ldid -S "$APP/HarvestHollow"
          {
            echo "== bundle"; ls -la "$APP"
            echo "== Info.plist"; plutil -p "$APP/Info.plist"
            echo "== sizes"; du -sh "$APP" "$APP"/* | sort -h | tail -15
          } > app.txt
          rm -rf ipa HarvestHollow.ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../HarvestHollow.ipa Payload)
          ls -lh HarvestHollow.ipa
          echo "::notice::HarvestHollow.ipa: $(du -h HarvestHollow.ipa | cut -f1), версия $(sed -n 's/^application\/short_version="\(.*\)"/\1/p' godot/export_presets.cfg | head -1) (${{ github.run_number }})"

      - name: Upload IPA
        if: ${{ !inputs.appstore }}
        uses: actions/upload-artifact@v4
        with:
          name: HarvestHollow-ipa
          path: HarvestHollow.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main' && !inputs.appstore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-godot-build-${{ github.run_number }}"
          gh release create "$TAG" HarvestHollow.ipa \
            --target "${{ github.sha }}" \
            --title "Harvest Hollow для iOS (Godot), сборка ${{ github.run_number }}" \
            --notes "Скачай HarvestHollow.ipa на iPhone и установи через SideStore: вкладка My Apps, кнопка +, выбрать файл. Ставится поверх прежней версии (тот же bundle id com.personal.gamefarm)." \
            --prerelease

      # Логи без скачивания артефактов: отдельная ветка с одним коммитом
      - name: Publish logs to ci-logs-ios branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L="$RUNNER_TEMP/ci-logs"
          rm -rf "$L" && mkdir -p "$L"
          cp prepare.log appstore.log iap.log admob.log import.log check.log tests.log export.log errors.txt app.txt "$L/" 2>/dev/null || true
          if [ -f build.log ]; then
            tail -400 build.log > "$L/build_tail.txt"
            [ "$(wc -c < build.log)" -lt 20000000 ] && cp build.log "$L/"
          fi
          cp godot/assets/splash.png "$L/" 2>/dev/null || true
          cp build-ios/HarvestHollow/HarvestHollow-Info.plist "$L/Info.plist" 2>/dev/null || true
          cp "build-ios/HarvestHollow/Launch Screen.storyboard" "$L/LaunchScreen.storyboard" 2>/dev/null || true
          echo "run ${{ github.run_number }}, ref ${{ github.ref_name }}, sha ${{ github.sha }}" > "$L/README.txt"
          grep -hE "ERROR|error:" "$L"/*.log 2>/dev/null | head -30 | sed 's/^/::warning::/' || true
          cd "$L"
          git init -q -b ci-logs-ios
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS Godot logs run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-logs-ios \
            || echo "::warning::Could not push logs"
