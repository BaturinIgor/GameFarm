name: GameFarm
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 13.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "25"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  GameFarm:
    type: application
    platform: iOS
    sources:
      - path: GameFarm
    info:
      path: GameFarm/Info.plist
      properties:
        CFBundleDisplayName: Harvest Hollow
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, de, fr, es, pt-BR, it, tr, pl, zh-Hans, zh-Hant, ja, ko, id, vi, th, hi]
        CFBundleAllowMixedLocalizations: true
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Включаются для сборки в App Store (см. docs/app-store.md)
        HHCloudSync: false
        HHGameCenter: false
        HHAppStore: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.gamefarm
        PRODUCT_NAME: GameFarm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GoogleMobileAds

schemes:
  GameFarm:
    build:
      targets:
        GameFarm: all
    run:
      config: Debug
    archive:
      config: Release
